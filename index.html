<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Moneyback Guarantee Checker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
    <h2>Moneyback Guarantee Checker</h2>

    <label>Order Date:</label>
    <input type="date" id="orderDate">

    <label>Moneyback Guarantee Days:</label>
    <input type="number" id="days" placeholder="Enter number of days">

    <button onclick="checkGuarantee()">Check</button>

    <div class="result">
        <p><strong>Expiry Date:</strong> <span id="expiryDate"></span></p>
        <p><strong>Status:</strong> <span id="status"></span></p>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
