<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Customer Service Dashboard</title>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Loader -->
  <div id="loader">
    <div class="spinner"></div>
    <p>Loading Dashboard...</p>
  </div>

  <!-- Header -->
  <header class="header">

    <div>
      <h1>Customer Service Utility Dashboard</h1>
      <p>Professional Support Tools</p>
    </div>

    <div class="top-right">
      <div id="clock" class="clock">00:00:00</div>

      <button id="darkModeToggle" class="toggle-btn">
        🌙 Dark Mode
      </button>
    </div>

  </header>

  <!-- Notification -->
  <div id="notification"></div>

  <!-- Dashboard -->
  <main class="dashboard">

    <!-- Guarantee Checker -->
    <section class="card">

      <h2>💰 Moneyback Guarantee Checker</h2>

      <form id="guaranteeForm">

        <div class="input-group">
          <label>Purchase Date</label>
          <input type="date" id="purchaseDate" required>
        </div>

        <div class="input-group">
          <label>Guarantee Period (Days)</label>
          <input type="number" id="guaranteeDays" placeholder="30" required>
        </div>

        <button type="submit" class="btn">
          Check Eligibility
        </button>

      </form>

      <div id="guaranteeResult" class="result-box"></div>

    </section>

    <!-- AHT Converter -->
    <section class="card">

      <h2>⏱ AHT Time Converter</h2>

      <div class="input-group">
        <label>Enter Seconds</label>
        <input type="number" id="secondsInput" placeholder="Enter seconds">
      </div>

      <div class="result-box">
        <p><strong>Minutes:</strong> <span id="minutesResult">0</span></p>
        <p><strong>Hours:</strong> <span id="hoursResult">0</span></p>
        <p><strong>HH:MM:SS:</strong> <span id="hhmmssResult">00:00:00</span></p>
      </div>

    </section>

    <!-- Refund Calculator -->
    <section class="card">

      <h2>📊 Refund Option Calculator</h2>

      <div class="input-group">
        <label>Product Price</label>
        <input type="number" id="productPrice" placeholder="1000">
      </div>

      <div class="input-group">
        <label>Refund Percentage (%)</label>
        <input type="number" id="refundPercent" placeholder="80">
      </div>

      <div class="input-group">
        <label>Processing Fee</label>
        <input type="number" id="processingFee" placeholder="50">
      </div>

      <button id="calculateRefund" class="btn">
        Calculate Refund
      </button>

      <div id="refundResult" class="result-box"></div>

    </section>

    <!-- Product Provider -->
    <section class="card">

      <h2>📦 Product Information Provider</h2>

      <div class="input-group">
        <label>Search Product</label>
        <input type="text" id="productSearch" placeholder="Enter Product ID or Name">
      </div>

      <button id="searchProduct" class="btn">
        Search Product
      </button>

      <div id="productResult" class="result-box"></div>

    </section>

  </main>

  <!-- Footer -->
  <footer class="footer">
    © 2026 Customer Service Dashboard
  </footer>

  <!-- JS -->
  <script src="script.js"></script>

</body>

</html>
