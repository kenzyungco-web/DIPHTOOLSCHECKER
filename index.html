<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Support Tools</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="container">
    <h1>Customer Support Tools</h1>

    <!-- MONEYBACK CHECKER -->
    <div class="card">
      <h2>Moneyback Guarantee Checker</h2>
      <label>Order Date:</label>
      <input type="date" id="orderDate">

      <label>Guarantee Period:</label>
      <select id="guaranteeDays">
        <option value="60">60 Days</option>
        <option value="90">90 Days</option>
        <option value="180">180 Days</option>
      </select>

      <button onclick="checkGuarantee()">Check</button>
      <p id="guaranteeResult"></p>
    </div>

    <!-- AHT CONVERTER -->
    <div class="card">
      <h2>AHT Converter</h2>
      <label>Seconds:</label>
      <input type="number" id="secondsInput">

      <button onclick="convertAHT()">Convert</button>
      <p id="ahtResult"></p>
    </div>

    <!-- REFUND CALCULATOR -->
    <div class="card">
      <h2>Refund Offer Calculator</h2>
      <label>Product Price:</label>
      <input type="number" id="priceInput">

      <button onclick="calculateRefund()">Calculate</button>
      <p id="refundResult"></p>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
